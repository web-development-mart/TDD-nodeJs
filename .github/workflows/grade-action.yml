name: Grade Lab

on:
  push:

jobs:
  grade:
    name: Milestone 1
    runs-on: ubuntu-latest

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: package.json

    - name: Install dependencies
      run: npm install
    
    - name: Read grade result
        id: grade-result
        if: always()
        run: |
          if [ -f grading/result.json ]; then
            echo "passed=$(node -p "require('./grading/result.json').passed")" >> $GITHUB_OUTPUT
            echo "failed=$(node -p "require('./grading/result.json').failed")" >> $GITHUB_OUTPUT
            echo "total=$(node -p "require('./grading/result.json').total")" >> $GITHUB_OUTPUT
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
          fi
      - name: Notify Google Sheet
        if: always()
        run: |
          curl -L -X POST "${{ secrets.SHEETS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"${{ github.repository }}\",
              \"student\": \"${{ github.actor }}\",
              \"tag\": \"${{ github.ref_name }}\",
              \"status\": \"${{ job.status }}\",
              \"milestone\": \"intro-part\",
              \"passed\": \"${{ steps.grade-result.outputs.passed }}\",
              \"failed\": \"${{ steps.grade-result.outputs.failed }}\",
              \"total\": \"${{ steps.grade-result.outputs.total }}\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            -w "\nHTTP %{http_code}\n"