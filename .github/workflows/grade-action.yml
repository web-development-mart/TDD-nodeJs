name: Grade Lab

on:
  push:

jobs:
  grade:
    name: Milestone 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=json --outputFile=results.json
        continue-on-error: true

      - name: Parse results
        id: grade-result
        if: always()
        run: |
          if [ ! -f results.json ]; then
            echo '{"numPassedTests":0,"numFailedTests":0,"numTotalTests":0}' > results.json
          fi
          echo "passed=$(jq '.numPassedTests // 0' results.json)" >> $GITHUB_OUTPUT
          echo "failed=$(jq '.numFailedTests // 0' results.json)" >> $GITHUB_OUTPUT
          echo "total=$(jq '.numTotalTests  // 0' results.json)" >> $GITHUB_OUTPUT

      - name: Notify Google Sheet
        if: always()
        run: |
          PASSED=${{ steps.grade-result.outputs.passed }}
          FAILED=${{ steps.grade-result.outputs.failed }}
          TOTAL=${{ steps.grade-result.outputs.total }}

          if [ "$FAILED" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
            STATUS="passed"
          else
            STATUS="failed"
          fi

          PAYLOAD=$(jq -n \
            --arg student  "${{ github.actor }}" \
            --arg status   "$STATUS" \
            --arg run_url  "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson passed "$PASSED" \
            --argjson failed "$FAILED" \
            --argjson total  "$TOTAL" \
            --arg tag      "${{ github.ref_name }}" \
            --arg milestone "intro-part" \
            '{
              student:   $student,
              status:    $status,
              run_url:   $run_url,
              passed:    $passed,
              failed:    $failed,
              total:     $total,
              tag:       $tag,
              milestone: $milestone
            }')

          curl -s -X POST "${{ secrets.SHEETS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -w "\nHTTP %{http_code}\n"
