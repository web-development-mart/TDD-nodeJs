# ============================================================
#  TDD — Test-Driven Development in CI
# ============================================================
#
#  The TDD cycle has three phases:
#
#    1. RED    — write a failing test for the behaviour you want
#    2. GREEN  — write the minimum code to make the test pass
#    3. REFACTOR — clean up without breaking anything
#
#  This pipeline enforces that cycle automatically:
#  no code reaches the main branch unless ALL tests are green.
#
#              ┌─────────────────────────────────────────┐
#              │                                         │
#              │   write test  →  RED  (CI blocks merge) │
#              │        ↓                                │
#              │   write code  →  GREEN (CI allows merge)│
#              │        ↓                                │
#              │   refactor    →  GREEN (CI stays green) │
#              │                                         │
#              └─────────────────────────────────────────┘
#
# ============================================================

name: TDD Pipeline

on:
  push:
    branches: ["**"]           # run on every branch push (catches RED phase)
  pull_request:
    branches: [main]           # gate merges to main behind a green suite

jobs:

  # ──────────────────────────────────────────────────────────
  #  Job: unit-tests
  #
  #  Runs the Vitest suite for utils.js.
  #  This is the core of the TDD feedback loop:
  #    - If tests FAIL  → the developer is in the RED phase
  #    - If tests PASS  → the developer has reached GREEN
  # ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .   # all commands run from the repo root

    steps:
      # 1. Check out the code that was just pushed
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js — vitest requires Node >= 20
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"           # cache node_modules between runs for speed

      # 3. Install dependencies (vitest, vite, …)
      #    `npm ci` is preferred over `npm install` in CI:
      #    it installs exactly what package-lock.json says — no surprises.
      - name: Install dependencies
        run: npm ci

      # 4. Run the test suite
      #
      #    vitest --run executes once and exits (no watch mode).
      #    Exit code  0 → all tests passed  → pipeline GREEN
      #    Exit code ≠0 → at least one test failed → pipeline RED
      #
      #    TDD insight: a failing test here is not a problem —
      #    it is the SIGNAL that tells you exactly what to implement next.
      - name: Run unit tests
        run: npx vitest run --reporter=verbose

      # 5. Upload the test report as a build artifact.
      #    Useful to inspect failures without re-running locally.
      - name: Upload test results
        if: always()             # upload even when tests fail (RED phase)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  #  Job: coverage (runs after tests pass)
  #
  #  Measures how much of utils.js is exercised by the tests.
  #  High coverage is a side-effect of good TDD:
  #  if you only write code to satisfy a test, every line
  #  you write is covered almost by definition.
  # ──────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests           # only run once tests are green

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # vitest can produce a coverage report with --coverage.
      # The @vitest/coverage-v8 provider uses Node's built-in V8 engine.
      - name: Generate coverage
        run: npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=text

      # TDD insight shown by coverage:
      #   RED phase   → coverage may drop   (new test, no code yet)
      #   GREEN phase → coverage climbs     (new code satisfies the test)
      #   REFACTOR    → coverage stays flat (behaviour unchanged)
